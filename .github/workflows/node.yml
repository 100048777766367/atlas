name: Atlas Supreme Fleet Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Tuần tra vẽ bản đồ mỗi 4 tiếng
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  run-atlas:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC
      - name: Kéo mã nguồn Atlas
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG CHUẨN HOÁ MỚI NHẤT: SETUP-PYTHON V7 & PYTHON 3.14
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. VẬN HÀNH ĐÀI CHỈ HUY HẢI ĐĂNG KERNEL.PY
      - name: Vận hành Đài Chỉ Huy Atlas
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU BẢN ĐỒ SỐ VÀ VẾT TÍCH VÀO GIT BỌC THÉP
      - name: Lưu bản đồ số và vết tích lên Git
        run: |
          git config --global user.name "Atlas-Supreme-Bot"
          git config --global user.email "bot@atlas.command"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🗺️ [Atlas Supreme] Cập nhật bản đồ sống toàn đàn & Thám tử Shadow Clones #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Bản đồ toàn cõi tĩnh lặng, không có biến thiên mới."
          fi
